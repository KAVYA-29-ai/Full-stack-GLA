<!DOCTYPE html>

<html>
<head>
<style>
* {
  box-sizing: border-box;
}

body {
margin: 0;
background: #F8FAFC;
color: #0F172A;
font-family: Arial, sans-serif;
}

.container {
max-width: 1200px;
margin: 0 auto;
padding: 0 24px;
}

nav {
height: 72px;
display: flex;
justify-content: space-between;
align-items: center;
font-size: 14px;
font-weight: 500;
}

nav a {
margin-left: 20px;
color: #475569;
text-decoration: none;
}

.menu {
display: none;
}

.hero {
min-height: 520px;
display: flex;
align-items: center;
padding-top: 80px;
}

.hero div {
max-width: 650px;
}

h1 {
font-size: 48px;
line-height: 1.1;
margin: 0;
}

.hero p {
font-size: 18px;
line-height: 1.6;
color: #475569;
margin: 20px 0 32px;
}

button {
background: #4F46E5;
color: white;
border: none;
padding: 12px 20px;
border-radius: 6px;
cursor: pointer;
}

button {
background: #4338CA;
}

.buttons {
display: flex;
gap: 16px;
}

h2 {
font-size: 32px;
margin-bottom: 48px;
}

.cards {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 24px;
}

.card {
background: #fff;
border: 1px solid #E2E8F0;
padding: 24px;
}

.card h3 {
font-size: 20px;
}

.card p {
font-size: 16px;
color: #475569;
}

@media (max-width: 1023px) {
.cards {
grid-template-columns: repeat(2, 1fr);
}
}

@media (max-width: 639px) {
nav .links {
display: none;
}

.menu {
display: block;
}

.hero {
text-align: center;
}

h1 {
font-size: 36px;
}

.buttons {
flex-direction: column;
}

.cards {
grid-template-columns: 1fr;
}
}
</style>

</head>

<body>
<nav class="container">
  <b>SaaSify</b>
  <div class="links"><a href="#">Home</a><a href="#">Features</a><a href="#">Pricing</a></div>
  <button class="menu">☰</button>
</nav>

<section class="hero container">
  <div>
    <h1>Build Faster with SaaS</h1>
    <p>Simple tools to manage and grow your business.</p>
    <div class="buttons"><button>Get Started</button><button>Learn More</button></div>
  </div>
</section>

<section class="container">
  <h2>Features</h2>
  <div class="cards">
    <div class="card"><h3>Easy to Use</h3><p>Simple and intuitive.</p></div>
    <div class="card"><h3>Fast & Secure</h3><p>Reliable and protected.</p></div>
    <div class="card"><h3>Analytics</h3><p>Useful business insights.</p></div>
  </div>
</section>
</body>
</html>
