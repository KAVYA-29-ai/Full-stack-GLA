<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            dashboard
        </title>
        <style>
           *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

.sidebar{
    width:220px;
    height:100vh;        
    background-color:#222;
    position:fixed;        
    left:0;
    top:0;
    display:flex;
    flex-direction:column;
    padding-top:20px;
}

.item{
    color:white;
    text-decoration:none;
    padding:15px 20px;
    font-size:20px;
    transition:0.3s;
}

.item:hover{
    background-color:#00bcd4;
}
/* Main Content */
.main{
    margin-left:220px;         
    height:100vh;
    display:flex;
    justify-content:center;    
            
}

.main h1{
    font-size:50px;
    color:#333;
}
        </style>
    </head>
    <body>
<div class="sidebar">
    <a href="#" class="item">🏠 Home</a>
    <a href="#" class="item">👤 Profile</a>
    <a href="#" class="item">🛒 Products</a>
    <a href="#" class="item">📞 Contact</a>
</div>
<div class="main">
    <h1>Dashboard</h1>
</div>
    </body>
</html>
