<html>
<head>
    <title>Dashboard</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        .sidebar{
            width:220px;
            height:100vh;
            background-color:#222;
            position:fixed;
            left:0;
            top:0;
            display:flex;
            flex-direction:column;
            padding-top:20px;
        }

        .item{
            color:white;
            text-decoration:none;
            padding:15px 20px;
            font-size:20px;
        }

        .products{
            display:flex;
            gap:20px;
            margin-top:40px;
            flex-wrap:wrap;
        }

        .product{
            width:220px;
            padding:20px;
            border:1px solid #ddd;
            border-radius:10px;
            box-shadow:0 2px 8px #ccc;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <a href="#" class="item">🏠 Home</a>
    <a href="#" class="item">👤 Profile</a>
    <a href="#" class="item">🛒 Products</a>
    <a href="#" class="item">📞 Contact</a>
</div>

<div class="main">

    <h1>Dashboard</h1>

    <div class="products">

        <div class="product">
            <h2>Laptop</h2>
            <p>High performance laptop</p>
            <button>View</button>
        </div>

        <div class="product">
            <h2>Phone</h2>
            <p>Latest smartphone</p>
            <button>View</button>
        </div>

        <div class="product">
            <h2>Headphones</h2>
            <p>Wireless headphones</p>
            <button>View</button>
        </div>

        <div class="product">
            <h2>Keyboard</h2>
            <p>Mechanical keyboard</p>
            <button>View</button>
        </div>

    </div>

</div>

</body>
</html>
