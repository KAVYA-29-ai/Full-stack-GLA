<html>
    <head>
        <title>Position & Box Layout</title>
        <style>
            .container{
                width: 100%;

            }
            #box1{
                background-color:antiquewhite
            }
            .box {
            width: 100%;
            max-width: 1000px;
            height: 100px;
            
            }
            #box2{
                background-color:rgb(221, 131, 13)
            }
            #box3{
                background-color:rgb(16, 50, 222)
            }
            #box4{
                background-color:rgb(47, 164, 11)
            }
            #box5{
                background-color:rgb(149, 37, 63)
            }

        </style>
    </head>
    <body>
        <div class="container">
            <div class="box" id="box1"></div>
            <div class="box" id="box2"></div>
            <div class="box" id="box3"></div>
            <div class="box" id="box4"></div>
            <div class="box" id="box5"></div>
        </div>

            
    </body>
</html>
