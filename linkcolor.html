<!DOCTYPE html>
<html>
    <head>
        <title>CSS Selectors</title>

        <style>
            a.link {
                color: red;
                text-decoration: none;
            }
            a.visited {
                color: purple;
            }
            a:hover {
                color: green;
            }
            
        </style>
    </head>
    <body>
        <a href="#" class="link">This is a link</a>
        <a href="#" class="visited">This is a visited link</a>
        <a href="#" class="hover">This is a hover link</a>
    </body>
</html>
