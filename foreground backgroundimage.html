<!DOCTYPE html>
<html>
<head>
    <title>Foreground and Background Image</title>
    <style>
        body {
            background-image: url('https://images.pexels.com/photos/459225/pexels-photo-459225.jpeg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0;
            height: 100vh;
        }

        .foreground {
            
            position: absolute;   
            top: 50%;             
            left: 50%;            
            transform: translate(-50%, -50%); 
            border: 20px solid black; 
            border-radius: 2px;  
            box-shadow: 0 0 20px rgba(0,0,0,0.7); 
            width: 700px;
        }
    </style>
</head>
<body>
    <img class="foreground" src="https://images.pexels.com/photos/414171/pexels-photo-414171.jpeg" alt="Foreground Image" width="400">
</body>
</html>
