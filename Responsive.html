<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        h1{
            text-align:center;
            margin:20px 0;
        }

        .container{
            background-color:blue;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 40px;
        }

        .logo{
            color:white;
            font-size:28px;
            font-weight:bold;
        }

        .menu{
            display:flex;
            gap:30px;
        }

        .card{
            color:white;
            text-decoration:none;
            font-size:18px;
            cursor:pointer;
        }

        .card:hover{
            color:yellow;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction:column;
                gap:15px;
                padding:15px 20px;
            }

            .menu {
                flex-wrap:wrap;
                justify-content:center;
                gap:15px;
            }
        }
    </style>
</head>

<body>

<h1>Task 2 : Responsive Navigation Bar</h1>

<div class="container">

    <div class="logo">
        <img src = "https://www.bing.com/images/search?view=detailV2&ccid=txvFQbMj&id=376E0A66C8F92BBC2B1C2C6A4EF3E2A06D8817C2&thid=OIP.txvFQbMj3NjwqIeSD5Zw-QHaHa&mediaurl=https%3a%2f%2fwww.pngarts.com%2ffiles%2f8%2fGithub-Logo-PNG-Image-Background.png&exph=1024&expw=1024&q=github+image&mode=overlay&FORM=IQFRBA&ck=D626C50EEBFB8756C4ECFCE9048DE06A&selectedIndex=0&idpp=serp&ajaxhist=0&ajaxserp=0" width="50" height="50" alt="GitHub Logo">
    </div>

    <div class="menu">
        <a class="card" href="https://student.glauniversity.in/Main/Index">Home</a>
        <a class="card" href="https://student.glauniversity.in/Main/Admission">Admission</a>
        <a class="card" href="https://student.glauniversity.in/Main/Event?Mode=All">Events</a>
        <a class="card" href="https://student.glauniversity.in/Main/Contact">Contact</a>
    </div>

</div>

</body>
</html>
