<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:lightgray;
    font-family:Arial, sans-serif;
}

.login{
    width:300px;
    background:white;
    padding:20px;
    border:1px solid black;
    border-radius:8px;
    text-align:center;
}

.login input {
    width:100%;
    padding:10px;
    margin:6px 0;
    box-sizing:border-box;
}

.login button {
    padding:10px 20px;
    cursor:pointer;
}




    </style>
</head>

<body>

<div class="login">
    <h2>Login</h2>

    <input type="text" placeholder="Username"><br>

    <input type="password" placeholder="Password"><br>

    <button>Login</button>
</div>

</body>
</html>
