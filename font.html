<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Font</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playwrite+BR+Guides&display=swap"
        rel="stylesheet"
    >

    <style>
        #p {
            font-family: "Playwrite BR Guides", cursive;
            font-weight: 400;
            font-style: normal;
            font-size: 40px;
        }
    </style>
</head>

<body>

    <p id="p">This is a paragraph with Playwrite BR Guides.</p>

</body>
</html>
