<html>
<head>
    <title>Document</title>

    <style>
        .container {
            display: grid;
            height: 500px;
            width: 500px;
            outline: 1px solid black;

            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);

            gap: 15px;
            color: white;
            border-radius : 20%;
        }

        #parent {
            display: grid;
            background-color: blue;
            grid-column: 1 / 3;
            grid-row: 1 / 3;

            border-radius: 30% 0 0 0;
        }

        #child {
            background-color: black;
            grid-column: 2;
            grid-row: 2;
        }

        #child:hover {
            background-color: red;
            cursor: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="parent">
            <div id="child">Hello</div>
        </div>
    </div>
</body>
</html>
