<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
</head>
<style>
    .container{
        display:grid;
        height:800px;
        width:800px;
        grid-template-areas:
        "box1 box2 box2"
        "box1 box5 box3"
        "box4 box5 box6";
        outline:1px dashed black;
        gap:10px;
    }
    .container > div{
        outline:1px solid black;
    }

    #box1{
        grid-column-start :1;
        grid-column-end: 3;
        grid-row-start: 1;
        grid-row-end: 3;
    }
</style>
<body>
    <div class="container">
        <div id ="box1">1</div>
        <div style="grid-area:box1;">1</div>
        <div style="grid-area:box2;">2</div>
        <div style="grid-area:box3;">3</div>
        <div style="grid-area:box4;">4</div>
        <div style="grid-area:box5;">5</div>
        <div style="grid-area:box6;">6</div>
    </div>
</body>
</html>
