<!DOCTYPE html>
<html>
  <head>
    <title>Radial Gradient Blue Light</title>
    <style>
      body {
        background-color: black;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh; 
        margin: 0; 
      }

      .background-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1; 
      }

      .box-radial {
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          rgb(155, 238, 255),
          rgb(109, 226, 249),
          rgb(26, 217, 255),
          rgb(1, 208, 249),
          rgb(0, 213, 255),
          rgb(0, 140, 255),
          rgb(33, 218, 255),
          rgb(18, 215, 255),
          rgb(73, 224, 255),
          rgb(102, 225, 250),
          rgb(128, 234, 255),
          rgb(168, 239, 253),
          rgb(215, 243, 249),
          rgb(241, 252, 255)
        );
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <img 
      src="https://i.pinimg.com/originals/0f/4f/87/0f4f872e00c0b8e9e7917b62878283ff.jpg" 
      alt="Background Image" 
      class="background-image"
    >

    <div class="box-radial"></div>
  </body>
</html>
