<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>

        button{
            width: 100px;
            height: 40px;
        }
        button.active {
            background-color: red;
            color: white;
        }
        button:hover {
            background-color: lightgreen;
        }
        </style>
    </head>
    <body>
        <center>
    <button >click me</button>
    <button class="active">click me</button>
    </center>
    </body>
</html>
